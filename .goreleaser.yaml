project_name: aiu
version: 2

builds:
  - id: cli
    main: ./cmd/aiu/main.go
    binary: aiu
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/trknhr/ai-utils/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  github:
    owner: trknhr
    name: ai-utils

brews:
  - name: aiu
    description: "AI Utils - Execute prompts with local AI CLIs"
    homepage: "https://github.com/trknhr/ai-utils"
    license: "Apache-2.0"
    repository:
      owner: trknhr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    install: |
      bin.install "aiu"
    test: |
      system "#{bin}/aiu", "--help"
