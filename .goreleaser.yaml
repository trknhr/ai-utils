project_name: aiu

builds:
  - id: cli
    main: ./main.go
    dir: ./cli
    binary: aiu
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - format: tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  github:
    owner: trknhr
    name: ai-utils
